[package]
name = "marklogic-tui"
version = "0.1.0"
edition = "2024"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
toml = "0.8"
anyhow = "1"
digest_auth = "0.3"
tui-textarea = "0.7.0"
urlencoding = "2.1.3"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
